<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-title">Shoply - قارن الأسعار بسهولة</title>
    <style>
        :root {
            --dark-olive: #2E2910;
            --deep-green: #2C5745;
            --cream-bg: #EBE3A7;
            --warm-orange: #EB7D00;
            --card-bg: #FFFFFF;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--cream-bg);
            margin: 0;
            padding: 0;
            color: var(--dark-olive);
        }

        header {
            background-color: var(--dark-olive);
            color: var(--cream-bg);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .search-box input {
            padding: 0.6rem 1rem;
            width: 300px;
            border-radius: 6px;
            border: 1px solid var(--cream-bg);
            background-color: #fbf9ed;
            color: var(--dark-olive);
            font-size: 1rem;
            outline: none;
        }

        .search-box input:focus {
            border-color: var(--warm-orange);
        }

        .lang-btn {
            background-color: var(--warm-orange);
            color: #fff;
            border: none;
            padding: 0.5rem 0.9rem;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.9rem;
            transition: opacity 0.2s;
            text-transform: uppercase;
        }

        .lang-btn:hover {
            opacity: 0.9;
        }

        .hero {
            text-align: center;
            padding: 2.5rem 1rem;
            background-color: var(--deep-green);
            color: var(--cream-bg);
        }

        .container {
            max-width: 1100px;
            margin: 2rem auto;
            padding: 0 1rem;
        }

        /* Category Section Styles (Now on Top) */
        .categories-section {
            margin-bottom: 2rem;
            padding-bottom: 1.5rem;
            border-bottom: 2px solid rgba(46, 41, 16, 0.15);
        }

        .categories-title {
            font-size: 1.3rem;
            font-weight: bold;
            color: var(--dark-olive);
            margin-bottom: 1rem;
        }

        .categories-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
            gap: 1rem;
        }

        .category-card {
            background-color: var(--card-bg);
            border: 1px solid rgba(46, 41, 16, 0.15);
            border-radius: 10px;
            padding: 1rem 0.5rem;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 2px 6px rgba(0,0,0,0.04);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.5rem;
        }

        .category-card:hover {
            transform: translateY(-3px);
            border-color: var(--warm-orange);
            box-shadow: 0 4px 12px rgba(235, 125, 0, 0.15);
        }

        .category-card.active {
            background-color: var(--deep-green);
            color: white;
            border-color: var(--deep-green);
        }

        .category-icon {
            font-size: 1.8rem;
        }

        .category-name {
            font-size: 0.9rem;
            font-weight: bold;
        }

        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1.5rem;
        }

        .product-card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 1.2rem;
            box-shadow: 0 4px 10px rgba(46, 41, 16, 0.08);
            border: 1px solid rgba(46, 41, 16, 0.1);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            gap: 0.8rem;
            transition: transform 0.2s ease;
        }

        .product-card:hover {
            transform: translateY(-4px);
        }

        .product-image-container {
            width: 100%;
            height: 180px;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #f9f8f0;
            border-radius: 8px;
            overflow: hidden;
        }

        .product-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .product-info {
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
        }

        .product-title {
            font-size: 1rem;
            font-weight: bold;
            color: var(--dark-olive);
            line-height: 1.4;
            height: 2.8em;
            overflow: hidden;
        }

        .store-name {
            font-size: 0.85rem;
            color: #666;
            font-weight: bold;
        }

        .rating-price-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 0.5rem;
        }

        .price {
            font-weight: bold;
            font-size: 1.1rem;
            color: var(--deep-green);
        }

        .product-rating {
            font-size: 0.9rem;
            color: var(--warm-orange);
            font-weight: bold;
        }

        .badge-best {
            align-self: flex-start;
            background-color: #fde8d0;
            color: var(--warm-orange);
            font-weight: bold;
            padding: 0.2rem 0.5rem;
            border-radius: 4px;
            font-size: 0.8rem;
            border: 1px solid var(--warm-orange);
        }

        .btn-buy {
            background-color: var(--deep-green);
            color: white;
            padding: 0.6rem;
            text-align: center;
            text-decoration: none;
            border-radius: 6px;
            font-size: 0.95rem;
            font-weight: bold;
            transition: background 0.2s;
        }

        .btn-buy:hover {
            background-color: #204234;
        }

        /* External search styling */
        .external-search-box {
            grid-column: 1 / -1;
            background: #fff8e7;
            border: 2px dashed var(--warm-orange);
            border-radius: 12px;
            padding: 2rem;
            text-align: center;
            margin-top: 1rem;
        }

        .external-search-box h3 {
            margin-top: 0;
            color: var(--dark-olive);
        }

        .external-links {
            display: flex;
            justify-content: center;
            gap: 1rem;
            flex-wrap: wrap;
            margin-top: 1rem;
        }

        .ext-btn {
            padding: 0.8rem 1.5rem;
            border-radius: 8px;
            text-decoration: none;
            color: white;
            font-weight: bold;
            font-size: 0.95rem;
            transition: opacity 0.2s;
        }

        .ext-noon { background-color: #FEEE00; color: #000; }
        .ext-jumia { background-color: #F68B1E; }
        .ext-btech { background-color: #004282; }
        .ext-dubizzle { background-color: #bebebe; color: #ff0101; }
    </style>
</head>

        function getDirectProductUrl(storeKey, queryTitle) {
            const encodedTitle = encodeURIComponent(queryTitle);
            const isAr = currentLang === 'ar';
            
            if (storeKey === "amazon") {
                return `https://www.amazon.eg/s?k=${encodedTitle}`;
            } else if (storeKey === "noon") {
                return isAr 
                    ? `https://www.noon.com/egypt-ar/search/?q=${encodedTitle}` 
                    : `https://www.noon.com/egypt-en/search/?q=${encodedTitle}`;
            } else if (storeKey === "jumia") {
                return isAr 
                    ? `https://www.jumia.com.eg/ar/catalog/?q=${encodedTitle}` 
                    : `https://www.jumia.com.eg/catalog/?q=${encodedTitle}`;
            } else if (storeKey === "dubizzle") {
                return isAr 
                    ?  `https://www.dubizzle.com.eg/ar/ads/q-${encodedTitle}` 
                    : `https://www.dubizzle.com.eg/en/ads/q-${encodedTitle}`;
            }
            return "#";
        }

        function toggleLanguage() {
            currentLang = currentLang === 'ar' ? 'en' : 'ar';
            
            // Update HTML direction and language
            document.documentElement.lang = currentLang;
            document.documentElement.dir = currentLang === 'ar' ? 'rtl' : 'ltr';

            // Update UI Texts
            const t = i18n[currentLang];
            document.getElementById('page-title').innerText = t.title;
            document.getElementById('search-input').placeholder = t.searchPlaceholder;
            document.getElementById('hero-title').innerText = t.heroTitle;
            document.getElementById('hero-subtitle').innerText = t.heroSubtitle;
            document.getElementById('lang-btn').innerText = t.langBtn;

            filterProducts();
        }

        function selectCategory(catId) {
            selectedCategory = catId;
            filterProducts();
        }

        function renderCategories() {
            const catContainer = document.getElementById('categories-container');
            const t = i18n[currentLang];

            let categoriesHTML = `<div class="categories-title">${t.categoriesTitle}</div><div class="categories-grid">`;
            
            categoriesData.forEach(cat => {
                const isActive = cat.id === selectedCategory ? 'active' : '';
                categoriesHTML += `
                    <div class="category-card ${isActive}" onclick="selectCategory('${cat.id}')">
                        <span class="category-icon">${cat.icon}</span>
                        <span class="category-name">${cat.name[currentLang]}</span>
                    </div>
                `;
            });
            categoriesHTML += `</div>`;
            catContainer.innerHTML = categoriesHTML;
        }

        function renderProducts(products, query = "") {
            const container = document.getElementById('product-container');
            container.innerHTML = '';
            const t = i18n[currentLang];

            // Render Categories at top
            renderCategories();

            // Render Products
            if (products.length > 0) {
                products.forEach(prod => {
                    const card = document.createElement('div');
                    card.className = 'product-card';

                    const title = prod.title[currentLang];
                    const storeName = prod.storeName[currentLang];
                    const badge = prod.badge[currentLang];
                    const directUrl = getDirectProductUrl(prod.storeKey, title);
                    const formattedPrice = prod.price.toLocaleString() + ' ' + t.currency;

                    card.innerHTML = `
                        <div class="product-image-container">
                            <img src="${prod.image}" alt="${title}" class="product-image">
                        </div>
                        <div class="product-info">
                            <div class="store-name">${storeName}</div>
                            <div class="product-title">${title}</div>
                            ${badge ? `<span class="badge-best">${badge}</span>` : ''}
                            <div class="rating-price-row">
                                <span class="price">${formattedPrice}</span>
                                <span class="product-rating">★ ${prod.rating}</span>
                            </div>
                        </div>
                        <a href="${directUrl}" target="_blank" class="btn-buy">${t.viewProduct} ${storeName.split(' ')[0]} ↗</a>
                    `;

                    container.appendChild(card);
                });
            }

            // Render External Search Box
            if (query.trim() !== "") {
                const extBox = document.createElement('div');
                extBox.className = 'external-search-box';
                const encodedQ = encodeURIComponent(query);
                const isAr = currentLang === 'ar';

                const amazonUrl = `https://www.amazon.eg/s?k=${encodedQ}`;
                const noonUrl = isAr ? `https://www.noon.com/egypt-ar/search/?q=${encodedQ}` : `https://www.noon.com/egypt-en/search/?q=${encodedQ}`;
                const jumiaUrl = isAr ? `https://www.jumia.com.eg/ar/catalog/?q=${encodedQ}` : `https://www.jumia.com.eg/catalog/?q=${encodedQ}`;
                const dubizzleUrl = isAr ?  `https://www.dubizzle.com.eg/ar/ads/q-${encodedQ}` : `https://www.dubizzle.com.eg/en/ads/q-${encodedQ}`;
                const btechUrl = isAr ? `https://btech.com/ar/s?q=${encodedQ}` : `https://btech.com/en/s?q=${encodedQ}`;

                extBox.innerHTML = `
                    <h3>${t.extSearchTitle} "${query}" ${t.extSearchTitleEnd}</h3>
                    <p>${t.extSearchDesc}</p>
                    <div class="external-links">
                        <a href="${amazonUrl}" target="_blank" class="ext-btn ext-amazon">${t.searchOn} Amazon ↗</a>
                        <a href="${noonUrl}" target="_blank" class="ext-btn ext-noon">${t.searchOn} Noon ↗</a>
                        <a href="${jumiaUrl}" target="_blank" class="ext-btn ext-jumia">${t.searchOn} Jumia ↗</a>
                        <a href="${btechUrl}" target="_blank" class="ext-btn ext-btech">${t.searchOn} B.TECH ↗</a>
                        <a href="${dubizzleUrl}" target="_blank" class="ext-btn ext-dubizzle">${t.searchOn} Dubizzle ↗</a>
                    </div>
                `;
                container.appendChild(extBox);
            }
        }

        function filterProducts() {
            const query = document.getElementById('search-input').value.toLowerCase().trim();
            const filtered = productsData.filter(p => {
                const titleAr = p.title.ar.toLowerCase();
                const titleEn = p.title.en.toLowerCase();
                const storeAr = p.storeName.ar.toLowerCase();
                const storeEn = p.storeName.en.toLowerCase();

                const matchesQuery = titleAr.includes(query) || titleEn.includes(query) || storeAr.includes(query) || storeEn.includes(query);
                const matchesCategory = selectedCategory === 'all' || p.category === selectedCategory;

                return matchesQuery && matchesCategory;
            });
            renderProducts(filtered, query);
        }
        // Initial Load
        renderProducts(productsData);
    </script>
</body>
</html>
